name: mobile compatibility

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# Serialize device runs to work with a single-session BrowserStack plan.
concurrency:
  group: browserstack-mobile
  cancel-in-progress: false

jobs:
  mobile:
    # Forks and Dependabot do not have access to repository Actions secrets.
    if: >-
      github.actor != 'dependabot[bot]' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BROWSER_STACK_USERNAME: ${{ secrets.BROWSER_STACK_USERNAME }}
      BROWSER_STACK_ACCESS_KEY: ${{ secrets.BROWSER_STACK_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --prefer-offline --no-audit
      - name: Run iOS Safari and Android Chrome on real devices
        run: npm run test:mobile
